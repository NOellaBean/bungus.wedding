<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#b8935a;--ink:#2a2820;--cream:#eae6dd}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);font-family:'Jost',sans-serif}

.bg{position:fixed;inset:-6px;z-index:0;overflow:hidden;pointer-events:none;background:var(--cream);transition:opacity 1s ease;contain:layout paint;transform:translateZ(0)}
.bg::before,.bg::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.bg::before{background:radial-gradient(ellipse 58% 48% at 50% 57%,rgba(255,250,238,.26) 0%,rgba(255,250,238,.16) 34%,rgba(255,250,238,0) 72%)}
.bg::after{background:rgba(255,244,224,.105)}
.bg-video{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:58% 28%;filter:blur(1.35px);transform:translate3d(0,-8%,0) scale(1.14);backface-visibility:hidden;will-change:transform}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}

.env-unit{
  position:relative;
  z-index:6;
  width:min(440px, 60vw, calc(60vh * 2156/2897));
  aspect-ratio:2156/2897;
  flex-shrink:0;
  filter:drop-shadow(0 16px 36px rgba(40,36,28,.16)) drop-shadow(0 3px 10px rgba(40,36,28,.09));
}

.env-layer{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:fill;display:block;user-select:none;pointer-events:none;
}

#l-open   {z-index:1}
#l-overlay{z-index:3}
#anim-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#l-closed {z-index:12}
#l-hover  {z-index:13}

#invite-wrap{
  position:absolute;
  top:0;bottom:0;left:4.711%;width:91.525%;
  z-index:2;pointer-events:none;
  /* Hard clip at envelope bottom — no top/side clipping (invite emerges upward) */
  clip-path:inset(-9999px -9999px 25% -9999px);
}
#invite-img{
  position:absolute;left:0;width:100%;
  top:45.591%;
  will-change:transform,opacity;
  /* Wrapper is now a div; internal layers fill it exactly */
}
/* ── LAYERED INVITATION STACK ───────────────────────────────────────────── */
.invitation-stack{
  display:block;
  position:relative; /* so absolute children are relative to this */
}
.inv-layer{
  display:block;
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  -webkit-user-drag:none;
}

/* ── SCROLL PHASE: ink-dissolve targeting ─────── */
.inv-text-layer, .inv-scroll-layer{
  will-change:opacity;
  /* NO mask, NO filter, NO blend-mode — only plain opacity transitions.
     The parent envUnit has filter:drop-shadow which composites all children
     together before applying the shadow. Any filter on a child creates
     additional compositing layers that interact badly with the parent shadow,
     causing dark edge artifacts. Plain opacity is the only safe approach. */
}
/* The blank paper layer is the layout reference; layers on top are absolute */
.inv-blank{
  position:relative; /* establishes block size for the wrapper */
}



.open-me{
  position:fixed;
  left:49.4%;
  top:23.5vh;
  transform:translateX(-50%) rotate(-6deg);
  z-index:4;

  display:flex;
  align-items:center;
  flex-wrap:nowrap;
  white-space:nowrap;
  gap:8px;

  color:#7f4f24;

  font-family:'Instrument Serif', 'Cormorant Garamond', serif;
  font-style:italic;
  font-weight:400;

  user-select:none;

  transition:opacity .55s ease, transform .55s ease;

.open-me.hidden{
  opacity:0;
  transform:translateX(-50%) translateY(-7px) rotate(-6deg);
}

.open-me.close-ready{
  left:auto;
  top:28px;
  transform:translateX(-50%) rotate(0deg) scale(1);
  pointer-events:auto;
  cursor:pointer;
  z-index:22;
  opacity:.92;
  animation:closeMeStopMotion 5.8s steps(10,end) infinite;
  transition:
    opacity .35s ease,
    filter .35s ease;

.open-me.close-ready:hover{

  filter:blur(.1px) brightness(1.08);
}

.open-me.is-close.close-ready:hover .open-me-arrow,

.open-me.is-close .open-me-arrow,

  animation:none;
  pointer-events:none;

.open-me.is-close .open-me-text{

}

.open-me-text{

.open-me-text::before{

  position:absolute;
  inset:0;

  transform:translate(-0.4px,-0.4px);

.open-me-text::after{
  content:"";
  position:absolute;
  inset:-8px -12px;
  border-radius:999px;
  background:radial-gradient(circle,
    rgba(255,240,210,.11) 0%,
    rgba(255,240,210,.04) 38%,
    transparent 72%);

  filter:blur(5px);
}

.open-me-arrow{
  width:40px;
  height:33px;
  opacity:.84;
  transform:translateY(5px) rotate(7deg);
}

.open-me:hover .open-me-arrow,
.open-me .open-me-arrow{
  animation:arrowEmphasis 5.8s steps(10,end) infinite;
}

@keyframes arrowEmphasis{
  0%, 50%, 100%{transform:translateY(5px) translateX(0) rotate(7deg)}
  18%{transform:translateY(6px) translateX(-1px) rotate(10deg)}
  36%{transform:translateY(4px) translateX(1px) rotate(5deg)}
  62%{transform:translateY(9px) translateX(2px) rotate(13deg)}
  70%{transform:translateY(5px) translateX(0) rotate(7deg)}
  84%{transform:translateY(6px) translateX(-1px) rotate(9deg)}
}

.open-me-arrow path{
  fill:none;
  stroke:currentColor;
  stroke-width:1.25;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;

  25%{transform:translateY(6px) rotate(10deg)}
  50%{transform:translateY(5px) rotate(5deg)}
  75%{transform:translateY(4px) rotate(9deg)}
  100%{transform:translateY(5px) rotate(7deg)}
}

@keyframes openMeStopMotion{
  0%{transform:translateX(-50%) translateY(0px) rotate(-6deg) scale(1)}
  10%{transform:translateX(-50%) translateY(1px) rotate(-5.2deg) scale(1.006)}
  20%{transform:translateX(-50%) translateY(4px) rotate(-4.4deg) scale(1.012)}
  30%{transform:translateX(-50%) translateY(6px) rotate(-3.8deg) scale(1.016)}
  40%{transform:translateX(-50%) translateY(5px) rotate(-5.1deg) scale(1.01)}
  50%{transform:translateX(-50%) translateY(3px) rotate(-6.4deg) scale(1.004)}
  60%{transform:translateX(-50%) translateY(1px) rotate(-7.6deg) scale(.998)}
  70%{transform:translateX(-50%) translateY(0px) rotate(-8deg) scale(.996)}
  80%{transform:translateX(-50%) translateY(2px) rotate(-7deg) scale(1)}
  90%{transform:translateX(-50%) translateY(1px) rotate(-6.3deg) scale(1.004)}
  100%{transform:translateX(-50%) translateY(0px) rotate(-6deg) scale(1)}
}
  36%{
    transform:translateX(-50%) translateY(5px) rotate(-4.8deg);
  }
  68%{
    transform:translateX(-50%) translateY(2px) rotate(-6.9deg);
  }
}


@keyframes closeMeStopMotion{
  0%{transform:translateX(-50%) translateY(0px) rotate(0deg) scale(1)}
  10%{transform:translateX(-50%) translateY(1px) rotate(.8deg) scale(1)}
  20%{transform:translateX(-50%) translateY(2px) rotate(.2deg) scale(1)}
  30%{transform:translateX(-50%) translateY(3px) rotate(-.7deg) scale(1)}
  40%{transform:translateX(-50%) translateY(2px) rotate(-.2deg) scale(1)}
  50%{transform:translateX(-50%) translateY(1px) rotate(.5deg) scale(1)}
  60%{transform:translateX(-50%) translateY(0px) rotate(0deg) scale(1)}
  70%{transform:translateX(-50%) translateY(1px) rotate(-.6deg) scale(1)}
  80%{transform:translateX(-50%) translateY(2px) rotate(.3deg) scale(1)}
  90%{transform:translateX(-50%) translateY(1px) rotate(.1deg) scale(1)}
  100%{transform:translateX(-50%) translateY(0px) rotate(0deg) scale(1)}
}

@keyframes closeArrowEmphasis{
  0%, 58%, 100%{transform:translateY(6px) rotate(128deg) scaleX(1)}
  64%{transform:translateY(9px) rotate(123deg) scaleX(1)}
  70%{transform:translateY(6px) rotate(128deg) scaleX(1)}

.close-me-corner{

  z-index:22;
  border:0;

  padding:6px 8px;

  font-family:'Instrument Serif', 'Cormorant Garamond', serif;
  font-style:italic;
  font-weight:400;
  font-size:clamp(17px, 1.62vw, 25px);
  line-height:1;
  letter-spacing:.025em;
  color:rgba(88,60,34,.46);

  opacity:0;
  pointer-events:none;
  cursor:pointer;
  user-select:none;
  mix-blend-mode:multiply;
  filter:blur(.08px);

  text-shadow:
    -0.7px -0.7px 0 rgba(255,247,226,.34),

/* ── VIGNETTE ─────────────────────────────────────────────────────
   Soft radial darkening at edges, like every cinematic lens.
   Above content but below grain so grain still affects the vignette area. */
.vignette{
  position:fixed;inset:0;
  z-index:18;
  pointer-events:none;
  background:radial-gradient(ellipse at center,
    transparent 45%,
    rgba(0,0,0,0.08) 75%,
    rgba(0,0,0,0.28) 100%);
  mix-blend-mode:multiply;
}

/* ── HALATION / BLOOM ─────────────────────────────────────────────
   A very subtle warm bloom emulating light scatter in film emulsion.
   Soft warm tone in highlights, almost imperceptible but adds cinematic warmth. */
.halation{
  position:fixed;inset:0;
  z-index:17;
  pointer-events:none;
  opacity:.55;
  mix-blend-mode:screen;
  background:radial-gradient(ellipse at 50% 45%,
    rgba(255,210,170,0.10) 0%,
    rgba(255,210,170,0.04) 30%,
    transparent 60%);
}

/* ── GATE WEAVE ──────────────────────────────────────────────────
   Real film cameras have tiny mechanical instability in the gate.
   The whole composition continuously drifts a fraction of a pixel.
   Applied to a wrapper so EVERY visual element (envelope, invite, bg)
   moves together as if recorded by a slightly imperfect camera. */
@keyframes gateWeave{
  0%   {transform:translate(0,0)}
  10%  {transform:translate(0.05%,-0.04%)}
  22%  {transform:translate(-0.04%,0.06%)}
  35%  {transform:translate(0.06%,0.03%)}
  48%  {transform:translate(-0.03%,-0.05%)}
  60%  {transform:translate(0.04%,0.05%)}
  73%  {transform:translate(-0.05%,-0.02%)}
  85%  {transform:translate(0.03%,0.04%)}
  100% {transform:translate(0,0)}
}
#film-gate{
  position:fixed;
  inset:0;
  pointer-events:none;
  /* This wrapper holds NOTHING — but exists as a reference for the body's gate-weave */
}
body{
  /* Compound animation: gate weave (mechanical wobble) + projector flicker (light variation) */
  animation: gateWeave 7s ease-in-out infinite,
             projectorFlicker 4.3s ease-in-out infinite;
  transform-origin:center center;
}


/* ── PROJECTOR FLICKER ────────────────────────────────────────────
   Real projectors flicker subtly as the shutter passes the gate.
   Extremely small brightness variation, irregular timing. Applied to body
   so the whole composition pulses imperceptibly. Never noticeable on its own;
   combined with grain it sells the film projection feel. */
@keyframes projectorFlicker{
  0%, 100%   {filter:brightness(1.000)}
  17%        {filter:brightness(0.992)}
  28%        {filter:brightness(1.006)}
  41%        {filter:brightness(0.997)}
  56%        {filter:brightness(1.003)}
  71%        {filter:brightness(0.994)}
  85%        {filter:brightness(1.002)}
}

/* ── LIGHT LEAK ──────────────────────────────────────────────────
   Rare, gentle warm gradient sweep — like light briefly seeping in at the
   edge of a film canister. Appears for ~1.5s every 18s. Very subtle warm
   amber gradient from one corner; mostly invisible, occasionally noticeable. */
.light-leak{
  position:fixed;inset:0;
  z-index:17;
  pointer-events:none;
  opacity:0;
  mix-blend-mode:screen;
  background:linear-gradient(115deg,
    rgba(255,180,110,0.18) 0%,
    rgba(255,180,110,0.08) 15%,
    transparent 35%);
  animation:lightLeakSweep 18s ease-in-out infinite;
}
@keyframes lightLeakSweep{
  0%,   85%, 100% {opacity:0;             transform:translateX(-3%) translateY(-2%)}
  90%             {opacity:0.6;            transform:translateX(0)     translateY(0)}
  95%             {opacity:0.3;            transform:translateX(1%)    translateY(1%)}
}

/* ── DUST MOTE ────────────────────────────────────────────────────
   A single soft out-of-focus speck that drifts slowly across the frame
   every ~22s. Never multiple at once. Just enough to suggest something
   physical is between the lens and the subject occasionally. */
.dust-mote{
  position:fixed;
  top:30%;left:-5%;
  width:6px;height:6px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(60,55,40,0.4) 0%, rgba(60,55,40,0.15) 40%, transparent 75%);
  z-index:17;
  pointer-events:none;
  opacity:0;
  filter:blur(2px);
  animation:moteDrift 22s linear infinite;
}
@keyframes moteDrift{
  0%   {opacity:0;       transform:translate(0,     0)    scale(0.8)}
  8%   {opacity:0.55;    transform:translate(15vw,  5vh)  scale(1)}
  20%  {opacity:0.5;     transform:translate(45vw,  18vh) scale(1.1)}
  35%  {opacity:0.3;     transform:translate(80vw,  35vh) scale(0.9)}
  45%  {opacity:0;       transform:translate(108vw, 45vh) scale(0.8)}
  100% {opacity:0;       transform:translate(108vw, 45vh) scale(0.8)}
}

/* ── CINEMATIC FILM GRAIN ──────────────────────────────────────────────
   Real animated grain: a <canvas> regenerates monochrome noise at ~24fps
   (cinema framerate) so the texture genuinely moves frame-to-frame like
   film stock. Sits above all visual layers, below the close button. */
.grain{
  position:fixed;
  inset:0;
  z-index:19;
  pointer-events:none;
  opacity:.09;
  mix-blend-mode:overlay;
  width:100%;
  height:100%;
}
</style>

    <img id="l-closed"  class="env-layer" src="assets/Closed.png" alt="">
    <img id="l-hover"   class="env-layer" src="assets/Hover.png"  alt="">
  </div>
</div>

<div class="info" id="info">
  <div class="info-date">Oct 1, 2026 &nbsp;·&nbsp; Dallas, Texas</div>
  <div class="info-rule"></div>
  <div class="open-cue">Open
    <svg width="11" height="6" viewBox="0 0 11 6" fill="none" stroke="#5c5448" stroke-width="1.2">
      <path d="M1 1l4.5 4.5L10 1"/>
    </svg>
  </div>
</div>


<script>
const SRCS = ["assets/Frame1.png", "assets/Frame2.png", "assets/Frame3.png", "assets/Frame4.png", "assets/Frame5.png", "assets/Frame6.png", "assets/Frame7.png", "assets/Frame8(final).png"];
const N = SRCS.length;

const bg        = document.getElementById('bg');
const bgVideo   = document.getElementById('bgVideo');
const stage     = document.getElementById('stage');
const envUnit   = document.getElementById('envUnit');
const lOpen     = document.getElementById('l-open');
const FULLYOPEN_SRC = 'assets/Fullyopen.PNG';
const NOPAPER_SRC  = 'assets/nopaper.png';
const lOverlay  = document.getElementById('l-overlay');
const lClosed   = document.getElementById('l-closed');
const lHover    = document.getElementById('l-hover');
const inviteImg = document.getElementById('invite-img');
const canvas    = document.getElementById('anim-canvas');
const ctx       = canvas.getContext('2d');
const info      = document.getElementById('info');
const openMe    = document.getElementById('openMe');
const openMeText = openMe ? openMe.querySelector('.open-me-text') : null;
const closeMeCorner = document.getElementById('closeMeCorner');

const BG_RATE = 0.45;

function setBackgroundPlayback() {
  bgVideo.defaultPlaybackRate = BG_RATE;
  bgVideo.playbackRate = BG_RATE;
}

if (bgVideo) {
  setBackgroundPlayback();
  bgVideo.addEventListener('loadedmetadata', setBackgroundPlayback, { once:true });
  bgVideo.addEventListener('canplay', () => {
    bgVideo.play().catch(()=>{});
  }, { once:true });
}

const frameImgs = SRCS.map(src => { const img = new Image(); img.src = src; return img; });
if (lHover.decode) lHover.decode().catch(()=>{});
frameImgs.forEach(img => { if (img.decode) img.decode().catch(()=>{}); });

let phase = 'idle';
let isHovering = false;
let rafId = null;

function instant(el, props) {
  el.style.transition = 'none';
  for (const [k,v] of Object.entries(props)) el.style[k] = v;
  el.offsetHeight;
}

function applyIdle() {
  envUnit.style.transition = 'none';
  // Visually centered: closed envelope's visible (non-transparent) center sits at
  // 71.99% from PNG top, so we shift the whole unit UP by 21.99% of its height.
  // Result: the green envelope pixels are centered in the viewport, not the PNG canvas.
  // +3px is the resting offset removed by the hover lift.
  envUnit.style.transform  = 'translateY(calc(-21.99% + 3px))';
  envUnit.style.cursor     = 'default';
  instant(lClosed,  { opacity:'1' });
  instant(lHover,   { opacity:'0', filter:'blur(0px)' });
  instant(lOpen,    { opacity:'0' });
  instant(lOverlay, { opacity:'0' });
  canvas.style.zIndex='10'; canvas.style.transition='none'; canvas.style.opacity='0';
  instant(inviteImg, { opacity:'0', transform:'translateY(0)' });
  inviteImg.style.transition='none';
  bg.style.transition='opacity 1s ease'; bg.style.opacity='1';
  stage.style.transition='none'; stage.style.transform='translateY(0)';
  info.classList.remove('hidden');
  if (closeMeCorner) closeMeCorner.classList.remove('visible');
  if (openMe) {
    openMe.classList.remove('hidden','close-ready','is-close','returning-open');
    openMe.style.transition = '';
    openMe.style.left = '';
    openMe.style.top = '';
    openMe.style.transform = '';
    openMe.style.opacity = '';
    openMe.style.filter = '';
    openMe.style.zIndex = '';
    openMe.style.pointerEvents = 'none';
    openMe.style.cursor = 'default';
    if (openMeText) openMeText.textContent = 'open me';
  }
}
applyIdle();

// ── PIXEL HITBOX ──────────────────────────────────────────────────────────
const HIT_W = 256;
const HIT_H = Math.round(HIT_W * 2897 / 2156);
const hitCv = document.createElement('canvas');
hitCv.width = HIT_W; hitCv.height = HIT_H;
const hitCtx = hitCv.getContext('2d', { willReadFrequently:true });
let hitMapReady = false;
function buildHitMap() {
  if (!lClosed.complete || !lClosed.naturalWidth) return;
  hitCtx.clearRect(0,0,HIT_W,HIT_H);
  hitCtx.drawImage(lClosed, 0, 0, HIT_W, HIT_H);
  hitMapReady = true;
}
if (lClosed.complete && lClosed.naturalWidth) buildHitMap();
else lClosed.addEventListener('load', buildHitMap);
function isOverEnvelope(cx, cy) {
  const r = envUnit.getBoundingClientRect();
  const rx = (cx - r.left)/r.width, ry = (cy - r.top)/r.height;
  if (rx<0||rx>1||ry<0||ry>1) return false;
  // Until the envelope mask image has decoded (common on the first load, esp.
  // mobile), fall back to the bounding box so the very first tap still opens it.
  if (!hitMapReady) return true;
  try { return hitCtx.getImageData(Math.floor(rx*HIT_W),Math.floor(ry*HIT_H),1,1).data[3] > 20; }
  catch(e) { return true; }
}

// ── HOVER (subtle blur-fade, no flicker) ──────────────────────────────────
function setHover(on) {
  if (on === isHovering) return;
  if (phase !== 'idle') {
    if (isHovering) {
      lHover.style.transition = 'opacity 0.15s ease';
      lHover.style.opacity = '0';
      isHovering = false;
    }
    return;
  }
  isHovering = on;
  if (on) {
    instant(lHover, { opacity:'0', filter:'blur(2.5px)' });
    lHover.style.transition = 'opacity 0.18s ease, filter 0.24s ease';
    lHover.offsetHeight;
    lHover.style.opacity = '1';
    lHover.style.filter  = 'blur(0px)';
    envUnit.style.transition = 'transform 0.30s cubic-bezier(0.34,1.15,0.64,1)';
    envUnit.style.transform  = 'translateY(-21.99%)';
    envUnit.style.cursor     = 'pointer';
  } else {
    lHover.style.transition = 'opacity 0.16s ease';
    lHover.style.opacity = '0';
    envUnit.style.transition = 'transform 0.30s ease';
    envUnit.style.transform  = 'translateY(calc(-21.99% + 3px))';
    envUnit.style.cursor     = 'default';
  }
}
envUnit.addEventListener('mousemove', e => {
  if (phase !== 'idle') return;
  setHover(isOverEnvelope(e.clientX, e.clientY));
});
envUnit.addEventListener('mouseleave', () => setHover(false));

// ── CANVAS ────────────────────────────────────────────────────────────────
function sizeCanvas() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.round(r.width  * dpr);
  canvas.height = Math.round(r.height * dpr);
}
requestAnimationFrame(() => requestAnimationFrame(sizeCanvas));
window.addEventListener('resize', () => { if (phase==='anim') sizeCanvas(); });

function drawFrame(i) {
  const dpr = window.devicePixelRatio || 1;
  const cw = canvas.width/dpr, ch = canvas.height/dpr;
  const img = frameImgs[i];
  if (!img.complete || !img.naturalWidth) return;
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,cw,ch);
  ctx.globalAlpha = 1;
  ctx.drawImage(img, 0, 0, cw, ch);
  ctx.restore();
}

// ── STOP-MOTION MOTION SYSTEM ─────────────────────────────────────────────
// One shared stepped clock drives BOTH the envelope opening and invite reveal.
// This keeps the "handmade frame-by-frame" feeling from dropping out halfway.
const STOP_FPS = 16;
const STEP_MS = 1000 / STOP_FPS;
const OPEN_TOTAL_MS = (N - 1) * STEP_MS;
const REVEAL_MS = 1000;
const MOTION_TOTAL_MS = OPEN_TOTAL_MS + REVEAL_MS;
const MOTION_SPLIT = OPEN_TOTAL_MS / MOTION_TOTAL_MS;
const REVEAL_STEPS = Math.round(REVEAL_MS / STEP_MS);

function clamp01(v) {
  return Math.min(Math.max(v, 0), 1);
}

// Soft cinematic ease, then quantized to the same stop-motion frame grid.
function cinematicEase(t) {
  t = clamp01(t);
  return t < 0.5
    ? 4 * t * t * t
    : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function steppedProgress(elapsed, duration, steps) {
  const raw = clamp01(elapsed / duration);
  const eased = cinematicEase(raw);
  return Math.round(eased * steps) / steps;
}

function frameAt(elapsed) {
  return Math.min(Math.round(elapsed / STEP_MS), N - 1);
}

function envelopeMotionAt(elapsed) {
  // SMOOTH eased progress (NOT stepped) — the envelope drift/zoom should glide
  // like a smooth camera move. The stop-motion feel comes from the discrete frame
  // swaps in frameAt(), not from chunking the underlying transform.
  const raw = clamp01(elapsed / MOTION_TOTAL_MS);
  const progress = cinematicEase(raw);
  const yProg = progress;

  const offsetPct = -21.99 * (1 - yProg);
  const yVh       = yProg * 10;
  const scale     = 1 + progress * 0.3;
  envUnit.style.transform = `translateY(calc(${offsetPct}% + ${yVh}vh)) scale(${scale})`;
}

function inviteMotionAt(elapsed) {
  // SMOOTH eased progress (NOT stepped) — invite slide should glide smoothly.
  const revealElapsed = elapsed - OPEN_TOTAL_MS;
  const raw = clamp01(revealElapsed / REVEAL_MS);
  const p = cinematicEase(raw);
  inviteImg.style.transform = `translateY(${-68 * p}%)`;
}

// ── ACT 2 CENTERING ───────────────────────────────────────────────────────
// Glide the whole envelope unit from the reveal end-pose (translateY 10vh,
// scale 1.3) to a screen-centered resting pose, and settle the invite so it
// sits centered in the viewport, measured from the TOP (stage is flex-centered,
// so translateY 0 + modest scale = true screen center regardless of screen size).
function centerForAct2(t2) {
  const e = clamp01(t2 / 0.30);
  const p = e * e * (3 - 2 * e);                 // smoothstep over first 30%
  const yVh   = 10 * (1 - p) - p * 6;             // 10vh -> -6vh (sits higher)
  const scale = 1.30;                             // keep invite full size (no shrink)
  envUnit.style.transform = `translateY(${yVh.toFixed(2)}vh) scale(${scale.toFixed(3)})`;
  const invY = -68 + p * 26;                      // -68% -> -42% (sits higher on screen)
  inviteImg.style.transform = `translateY(${invY.toFixed(2)}%)`;
}
window.__centerForAct2 = centerForAct2;

// ── PLAY OPENING ──────────────────────────────────────────────────────────
function playOpening() {
  phase = 'anim';
  isHovering = false;
  // Keep the prompt visible until the envelope/paper physically covers it.
  // It sits behind all envelope layers, so the animation itself masks it.
  if (openMe) {
    openMe.classList.remove('hidden','close-ready','is-close','returning-open');
    openMe.style.pointerEvents = 'none';
    openMe.style.cursor = 'default';
    if (openMeText) openMeText.textContent = 'open me';
  }
  sizeCanvas();

  // Lock envUnit at visually-centered position (-21.99%) — shared anchor for all layers
  envUnit.style.transition = 'none';
  envUnit.style.transform  = 'translateY(-21.99%)';
  envUnit.style.cursor     = 'default';

  // Canvas above lHover for the entire opening animation
  canvas.style.zIndex='15';
  canvas.style.transition='none';
  drawFrame(0);
  canvas.style.opacity = '1';

  lClosed.style.transition='none'; lClosed.style.opacity='0';
  lHover.style.transition='none';  lHover.style.opacity='0';
  inviteImg.style.transition='none';
  inviteImg.style.opacity='0';
  inviteImg.style.transform='translateY(0)';

  let startTs = null;
  let lastFi = 0;
  let didHandoff = false;
  let didMorphPrompt = false;

  function tick(ts) {
    if (!startTs) startTs = ts;
    const elapsed = ts - startTs;
    const fi = frameAt(elapsed);

    if (!didHandoff && fi !== lastFi) {
      drawFrame(fi);
      lastFi = fi;
    }

    envelopeMotionAt(elapsed);

    if (!didMorphPrompt && elapsed >= OPEN_TOTAL_MS) {
      didMorphPrompt = true;
      if (openMe) {
        // Outgoing: once the flap/paper has covered the prompt, cut it off instantly.
        // Do not fade here, because the fade is visible behind the envelope.
        openMe.style.transition = 'none';
        openMe.classList.add('hidden');
        openMe.offsetHeight; // force the instant state to apply before restoring transitions
        openMe.style.transition = '';
      }
      if (closeMeCorner) closeMeCorner.classList.add('visible');
    }

    if (!didHandoff && elapsed >= OPEN_TOTAL_MS) {
      didHandoff = true;
      drawFrame(N - 1);
      handoffToOpen();
    }

    if (didHandoff) {
      inviteMotionAt(elapsed);
    }

    if (elapsed < MOTION_TOTAL_MS) {
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = null;
      envelopeMotionAt(MOTION_TOTAL_MS);
      inviteImg.style.transform = 'translateY(-68%)';
      phase = 'done';
      if (closeMeCorner) closeMeCorner.classList.add('visible');
      // Swap envelope back to no-paper version — invitation fully pulled out
      lOpen.src = NOPAPER_SRC;
      // Remove bottom clip-path so full invitation is visible
      // (clip was needed during pull-out animation to hide bottom edge; not needed after)
      const invWrap = document.getElementById('invite-wrap');
      if (invWrap) {
        invWrap.style.transition = 'clip-path 0.4s ease';
        invWrap.style.clipPath = 'none';
      }
      // Enable virtual scroll phase
      enableVirtualScroll();
    }
  }
  rafId = requestAnimationFrame(tick);
}

// ── HANDOFF ───────────────────────────────────────────────────────────────
function handoffToOpen() {
  phase = 'reveal';
  canvas.style.zIndex = '10';

  // Show open envelope + overlay + invite instantly. The RAF clock above keeps
  // controlling the pull-out, so the reveal remains stop-motion instead of
  // switching into a separate CSS-smooth movement.
  lOpen.style.opacity    = '1';
  lOverlay.style.opacity = '1';
  // Snap transform to resting position instantly, but fade opacity in
  // over ~120ms — almost imperceptible but smooths the hand-off from canvas frames
  // to the static open state, removing any visible "appear" pop.
  instant(inviteImg, { opacity:'0', transform:'translateY(0)' });
  inviteImg.style.transition = 'opacity 0.12s ease-out';
  // Next frame: trigger the fade-in (transition only runs if the property is set
  // AFTER the transition is applied)
  requestAnimationFrame(() => { inviteImg.style.opacity = '1'; });

  canvas.style.transition = 'none';
  canvas.style.opacity    = '0';
}

// ── REVEAL ────────────────────────────────────────────────────────────────
// Reveal is now handled inside playOpening() by inviteMotionAt(), using the
// same 12fps stepped clock as the opening frames.


function getCloseMeTarget() {
  if (!openMe) return { left: window.innerWidth - 76, top: 28, scale: 1 };

  const margin = Math.max(12, Math.min(24, window.innerWidth * 0.025));
  const top = Math.max(18, Math.min(32, window.innerHeight * 0.045));
  const envRect = envUnit.getBoundingClientRect();

  const prevTransform = openMe.style.transform;
  openMe.style.transform = 'translateX(-50%) rotate(0deg) scale(1)';
  const rawWidth = Math.max(openMe.getBoundingClientRect().width, 1);
  openMe.style.transform = prevTransform;

  const availableRight = Math.max(0, window.innerWidth - envRect.right - margin * 2);
  const scale = Math.max(0.58, Math.min(1, availableRight / rawWidth));
  const renderedWidth = rawWidth * scale;

  let left;
  if (availableRight >= renderedWidth + 2) {
    // Prefer the true right edge, but clamp so the label remains in the side gutter.
    left = window.innerWidth - margin - renderedWidth / 2;
    left = Math.max(left, envRect.right + margin + renderedWidth / 2);
  } else {
    // Extremely narrow fallback: stay as far right as possible and shrink.
    left = window.innerWidth - margin - renderedWidth / 2;
  }

  return { left, top, scale };
}

function morphOpenMeToClose() {
  if (!openMe) return;

  // The envelope/paper has visually covered the original prompt. Change the
  // same paper sprite into “close me,” then let it dart into the side gutter.
  openMe.classList.remove('hidden','close-ready','returning-open');
  openMe.classList.add('is-close');
  if (openMeText) openMeText.textContent = 'close me';

  openMe.style.transition = 'none';
  openMe.style.left = '49.4%';
  openMe.style.top = '23.5vh';
  openMe.style.transform = 'translateX(-50%) rotate(-6deg) scale(1)';
  openMe.style.opacity = '1';
  openMe.style.pointerEvents = 'none';
  openMe.style.cursor = 'default';
  openMe.style.zIndex = '6';

  const target = getCloseMeTarget();
  const midA = getCloseMeTarget();
  const midB = getCloseMeTarget();

  const flight = openMe.animate([
    {
      left:'49.4%',
      top:'23.5vh',
      transform:'translateX(-50%) translateY(0px) rotate(-6deg) scale(1)',
      filter:'blur(.15px)',
      offset:0
    },
    {
      left:`${Math.max(window.innerWidth * 0.56, target.left - 260)}px`,
      top:`${Math.max(18, target.top + 58)}px`,
      transform:`translateX(-50%) translateY(-7px) rotate(-3deg) scale(${Math.max(target.scale, .86)})`,
      filter:'blur(.22px)',
      offset:.22
    },
    {
      left:`${Math.max(window.innerWidth * 0.66, target.left - 165)}px`,
      top:`${target.top + 18}px`,
      transform:`translateX(-50%) translateY(6px) rotate(1deg) scale(${target.scale})`,
      filter:'blur(.18px)',
      offset:.48
    },
    {
      left:`${Math.max(window.innerWidth * 0.74, target.left - 70)}px`,
      top:`${target.top + 34}px`,
      transform:`translateX(-50%) translateY(-4px) rotate(-1deg) scale(${target.scale})`,
      filter:'blur(.2px)',
      offset:.72
    },
    {
      left:`${target.left}px`,
      top:`${target.top}px`,
      transform:`translateX(-50%) translateY(0px) rotate(0deg) scale(${target.scale})`,
      filter:'blur(.15px)',
      offset:1
    }
  ], {
    duration:360,
    easing:'steps(8,end)',
    fill:'forwards'
  });

  flight.onfinish = () => {
    const finalTarget = getCloseMeTarget();
    openMe.style.left = `${finalTarget.left}px`;
    openMe.style.top = `${finalTarget.top}px`;
    openMe.style.transform = `translateX(-50%) rotate(0deg) scale(${finalTarget.scale})`;
    openMe.style.filter = '';
    openMe.style.zIndex = '22';
    openMe.classList.add('close-ready');
    if (phase === 'done') {
      openMe.style.pointerEvents = 'auto';
      openMe.style.cursor = 'pointer';
    } else {
      openMe.style.pointerEvents = 'none';
      openMe.style.cursor = 'default';
    }
  };
}

function animateCloseMeBackToOpen() {
  if (!openMe) return Promise.resolve();

  openMe.style.pointerEvents = 'none';
  openMe.style.cursor = 'default';
  // Return to the tucked paper layer immediately, so it disappears back into
  // the envelope system instead of floating above it during the reset.
  openMe.style.zIndex = '6';
  openMe.classList.remove('close-ready');
  openMe.classList.add('is-close','returning-open');
  if (openMeText) openMeText.textContent = 'close me';

  const startTarget = getCloseMeTarget();
  openMe.style.left = `${startTarget.left}px`;
  openMe.style.top = `${startTarget.top}px`;
  openMe.style.transform = `translateX(-50%) rotate(0deg) scale(${startTarget.scale})`;

  const textSwapTimer = setTimeout(() => {
    openMe.classList.remove('is-close');
    if (openMeText) openMeText.textContent = 'open me';
  }, 95);

  const returnFlight = openMe.animate([
    {
      left:`${startTarget.left}px`,
      top:`${startTarget.top}px`,
      transform:`translateX(-50%) translateY(0px) rotate(0deg) scale(${startTarget.scale})`,
      opacity:.92,
      filter:'blur(.15px)',
      offset:0
    },
    {
      left:`${Math.max(window.innerWidth * 0.70, startTarget.left - 120)}px`,
      top:`${startTarget.top + 42}px`,
      transform:'translateX(-50%) translateY(5px) rotate(1deg) scale(1)',
      opacity:.7,
      filter:'blur(.2px)',
      offset:.28
    },
    {
      left:'59%',
      top:'18.5vh',
      transform:'translateX(-50%) translateY(-6px) rotate(-3deg) scale(1)',
      opacity:.82,
      filter:'blur(.18px)',
      offset:.58
    },
    {
      left:'49.4%',
      top:'23.5vh',
      transform:'translateX(-50%) translateY(0px) rotate(-6deg) scale(1)',
      opacity:1,
      filter:'blur(.15px)',
      offset:1
    }
  ], {
    duration:340,
    easing:'steps(8,end)',
    fill:'forwards'
  });

  return new Promise(resolve => {
    returnFlight.onfinish = () => {
      clearTimeout(textSwapTimer);
      openMe.classList.remove('is-close','close-ready','hidden','returning-open');
      if (openMeText) openMeText.textContent = 'open me';
      openMe.style.left = '';
      openMe.style.top = '';
      openMe.style.transform = '';
      openMe.style.opacity = '';
      openMe.style.filter = '';
      openMe.style.zIndex = '';
      openMe.style.pointerEvents = 'none';
      openMe.style.cursor = 'default';
      resolve();
    };
  });
}

function reset() {
  if (phase === 'closing') return;
  phase = 'closing';
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

  if (closeMeCorner) closeMeCorner.classList.remove('visible');
  if (openMe) {
    openMe.classList.add('hidden');
    openMe.classList.remove('close-ready','is-close','returning-open');
    openMe.style.pointerEvents = 'none';
    openMe.style.cursor = 'default';
    if (openMeText) openMeText.textContent = 'open me';
  }

  // Start the envelope closing immediately. The open prompt reappears late in
  // the close, while the flap/paper can visually cover it, so it feels tucked
  // behind the envelope instead of popping onto the open frame.
  envUnit.style.transition   = 'transform 0.38s ease';
  envUnit.style.transform    = 'translateY(calc(-21.99% + 3px))';
  inviteImg.style.transition = 'transform 0.38s ease, opacity 0.28s ease';
  inviteImg.style.transform  = 'translateY(0)';
  inviteImg.style.opacity    = '0';
  bg.style.opacity = '1';

  setTimeout(() => {
    if (openMe) openMe.classList.remove('hidden');
  }, 255);

  setTimeout(() => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    applyIdle();
    isHovering = false;
    phase = 'idle';
    buildHitMap();
  }, 430);

  // ── Full scroll-phase teardown ───────────────────────────────────────────
  vScrollActive = false;
  vScroll       = 0;
  vScrollTarget = 0;
  // Restore lOpen to Fullyopen (NoPaper was set on done)
  lOpen.src = FULLYOPEN_SRC;
  // Clear fall transforms on envelope layers
  [lOpen, lOverlay].forEach(el => {
    if (!el) return;
    el.style.transition = 'none';
    el.style.transform  = '';
    el.style.opacity    = '';
  });
  // Restore clip-path (was removed at phase=done)
  const invWrapR = document.getElementById('invite-wrap');
  if (invWrapR) {
    invWrapR.style.transition = 'clip-path 0.25s ease';
    invWrapR.style.clipPath   = 'inset(-9999px -9999px 25% -9999px)';
  }
  // Reset text dissolve layers to fully visible
  [document.querySelector('.inv-scroll-layer'),
   document.querySelector('.inv-text-layer')].forEach(el => {
    if (!el) return;
    el.style.filter = ''; el.style.opacity = ''; el.style.transform = '';
  });
  // Reset lighter.png overlay to invisible
  const lighterReset = document.getElementById('inv-lighter');
  if (lighterReset) { lighterReset.style.transition = 'none'; lighterReset.style.opacity = '0'; }
  // Fade bg2 back to invisible
  const bg2El = document.getElementById('bg2-overlay');
  if (bg2El) { bg2El.style.transition = 'none'; bg2El.style.opacity = '0'; }
  // Tear down act 2 as well
  if (window.resetScene) window.resetScene();
}



envUnit.addEventListener('click', e => {
  if (phase === 'idle' && isOverEnvelope(e.clientX, e.clientY)) playOpening();
});
if (closeMeCorner) {
  closeMeCorner.addEventListener('click', e => {
    if (phase !== 'done') return;
    e.preventDefault();
    e.stopPropagation();
    reset();
  });
}
</script>

<script>
// ── CINEMATIC FILM GRAIN ───────────────────────────────────────────────
// Generates fresh monochrome noise every frame at ~24fps. Genuine film-stock
// feel: the grain texture is fully resampled each frame (not just translated),
// so it reads as living film, not a static texture sliding around.
(function() {
  const cv  = document.getElementById('grainCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');

  // Low-resolution grain buffer (scaled up by CSS = larger, more visible particles)
  // 220×165 ≈ 36k pixels → very fast to regenerate
  const GW = 480, GH = 360;
  cv.width  = GW;
  cv.height = GH;
  // Higher resolution = finer grain particles, more refined feel

  // Reusable ImageData
  const img = ctx.createImageData(GW, GH);
  const buf = img.data;

  // Pre-fill alpha channel to 255 once (we only update RGB)
  for (let i = 3; i < buf.length; i += 4) buf[i] = 255;

  const FPS = 9;
  const FRAME_MS = 1000 / FPS;
  let lastTs = 0;

  function paint(ts) {
    if (ts - lastTs >= FRAME_MS) {
      lastTs = ts;
      // Generate fresh noise — monochrome (R=G=B = random grey)
      // Gaussian-ish distribution gives more natural grain than uniform
      for (let i = 0; i < buf.length; i += 4) {
        // Tight gaussian-ish distribution centered on 128 (mid-grey).
        // Sum of 4 random values → smooth bell curve, then narrow range around 128
        // so noise is gentle and refined — not high-contrast static.
        const r = (Math.random() + Math.random() + Math.random() + Math.random()) * 0.25;
        const v = (128 + (r - 0.5) * 140) | 0; // mostly 70–185, refined but visible
        buf[i]   = v;
        buf[i+1] = v;
        buf[i+2] = v;
      }
      ctx.putImageData(img, 0, 0);
    }
    requestAnimationFrame(paint);
  }
  requestAnimationFrame(paint);
})();

// ══ VIRTUAL SCROLL + ENVELOPE FALL + INK DISSOLVE ════════════════════════════
// After the invitation is fully revealed, wheel/touch drive a virtual scroll.
// The invitation wrapper stays fixed; envelope elements fall away; text dissolves.

let vScroll      = 0;         // virtual scroll Y in "units"
const PHASE1_MAX    = 600;    // act 1: envelope clears + ink dissolves (unchanged)
const V_SCROLL_MAX  = 1750;   // act 1 (0-600) + act 2 (600-1750) — tighter so it lands faster
const V_SCROLL_EASE = 0.12;   // lerp factor for smooth scroll following
let vScrollTarget   = 0;
let vScrollRafId    = null;
let vScrollActive   = false;
let touchStartY     = 0;

// SVG filter element refs (set once)
// (SVG filter refs removed — using plain CSS opacity fade)

function enableVirtualScroll() {
  // Remove any stale listeners before adding fresh ones (prevents stacking on reopen)
  window.removeEventListener('wheel',      onVWheel);
  window.removeEventListener('touchstart', onVTouchStart);
  window.removeEventListener('touchmove',  onVTouchMove);
  if (vScrollRafId) { cancelAnimationFrame(vScrollRafId); vScrollRafId = null; }

  vScroll = 0; vScrollTarget = 0; vScrollActive = true;

  // Reset text layers to fully visible on each open
  [document.querySelector('.inv-scroll-layer'),
   document.querySelector('.inv-text-layer')].forEach(el => {
    if (!el) return;
    el.style.filter = ''; el.style.opacity = '1'; el.style.transform = '';
  });
  // Reset lighter.png to invisible
  const lighterEvs = document.getElementById('inv-lighter');
  if (lighterEvs) lighterEvs.style.opacity = '0';

  [lOpen, lOverlay].forEach(el => {
    if (el) el.classList.add('env-layer-fallable');
  });

  window.addEventListener('wheel',      onVWheel,      { passive:false });
  window.addEventListener('touchstart', onVTouchStart, { passive:true  });
  window.addEventListener('touchmove',  onVTouchMove,  { passive:false });

  if (window.resetScene)  window.resetScene();
  if (window.layoutScene) window.layoutScene();

  vScrollTick();
}

function onVWheel(e) {
  if (!vScrollActive) return;
  if (phase !== 'done') return;
  e.preventDefault();
  vScrollTarget = Math.max(0, Math.min(V_SCROLL_MAX, vScrollTarget + e.deltaY * 4.65));
}

function onVTouchStart(e) {
  if (!vScrollActive) return;
  touchStartY = e.touches[0].clientY;
}
function onVTouchMove(e) {
  if (!vScrollActive || phase !== 'done') return;
  e.preventDefault();
  const dy = touchStartY - e.touches[0].clientY;
  touchStartY = e.touches[0].clientY;
  vScrollTarget = Math.max(0, Math.min(V_SCROLL_MAX, vScrollTarget + dy * 5.10));
}

function vScrollTick() {
  // Smooth follow
  const prev = vScroll;
  vScroll += (vScrollTarget - vScroll) * V_SCROLL_EASE;
  if (Math.abs(vScroll - vScrollTarget) < 0.3) vScroll = vScrollTarget;

  if (vScroll !== prev) applyVirtualScroll(vScroll);

  vScrollRafId = requestAnimationFrame(vScrollTick);
}

function applyVirtualScroll(sy) {
  // Act 1 keeps its original 0-600 scroll window untouched; act 2 runs after it.
  const t  = Math.min(1, sy / PHASE1_MAX);
  const t2 = Math.min(1, Math.max(0, (sy - PHASE1_MAX) / (V_SCROLL_MAX - PHASE1_MAX)));

  // ── A. ENVELOPE FALLS AWAY ────────────────────────────────────────────
  // Only lOpen (back) and lOverlay (front V-flap) need to fall — they're
  // the two visible envelope layers in the open state.
  // lClosed and lHover are already at opacity:0 from playOpening() and
  // must stay hidden; touching them here caused the "Hover.png front layer"
  // and "dark corner" bugs (they snapped to opacity:1 at scroll t=0).
  const envFallT    = Math.min(1, t / 0.55);
  const envFallEase = envFallT * envFallT * (3 - 2 * envFallT); // smooth-step
  const envFallVh   = envFallEase * 130; // translate down by 130vh max

  [lOpen, lOverlay].forEach(el => {
    if (!el) return;
    el.style.transform = `translateY(${envFallVh}vh)`;
    // Fade as they recede
    el.style.opacity = String(Math.max(0, 1 - envFallEase * 0.7));
  });

  // ── A2. BACKGROUND crossfade (t 0.15→0.65) ─────────────────────────────
  const bgFadeT = Math.min(1, Math.max(0, (t - 0.15) / 0.50));
  const bg2El = document.getElementById('bg2-overlay');
  if (bg2El) bg2El.style.opacity = bgFadeT.toFixed(4);

  // ── B. "(scroll to unfold)" fades first (t 0.10→0.45) ─────────────────
  // 10% dead zone, then smooth fade over 35% of scroll range.
  const scrollDisT = Math.min(1, Math.max(0, (t - 0.10) / 0.35));
  fadeTextLayer(document.querySelector('.inv-scroll-layer'), scrollDisT);

  // ── C. Invitation text fades second (t 0.25→0.65) ──────────────────────
  // Starts at 25%, independent of scroll layer, fades over 40% of range.
  const textDisT = Math.min(1, Math.max(0, (t - 0.25) / 0.40));
  fadeTextLayer(document.querySelector('.inv-text-layer'), textDisT);

  // ── D. Lighter.png crossfade (t 0.30→0.80) ──────────────────────────────
  // Image.png stays underneath; lighter.png fades in above it.
  const lighterT = Math.min(1, Math.max(0, (t - 0.30) / 0.50));
  const lighterEl = document.getElementById('inv-lighter');
  if (lighterEl) lighterEl.style.opacity = lighterT.toFixed(4);

  // ── E. ACT 2 — flat-lay assembles, invitation is written ──────────────
  if (window.applyScene) window.applyScene(t2);
}

// ── INK DISSOLVE EFFECT ────────────────────────────────────────────────────
// Clean opacity-only fade — no SVG filters. See fadeTextLayer().
//le and blur for a "dust dispersing from parchment" feel.
function fadeTextLayer(el, t) {
  // Clean opacity-only fade. No SVG filters, no masks, no blend modes.
  // t=0: fully visible. t=1: fully invisible.
  // Smoothstep easing: slow start, linear middle, slow end.
  if (!el) return;
  const ease = t * t * (3 - 2 * t);          // smoothstep
  el.style.opacity = String((1 - ease).toFixed(4));
  // Max 0.5px blur — purely optional, stays subtle throughout
  el.style.filter  = t > 0.05 ? `blur(${(ease * 0.5).toFixed(3)}px)` : '';
}
</script>

<script>
/* ══ ACT 2 — natural placement (v69) ══════════════════════════════════════
   Fix for "assets just appear": each piece now EMERGES — it starts noticeably
   off its resting spot AND at zero opacity, then glides in while fading up over
   the first third of its travel. By the time it's opaque it's already moving,
   so it reads as being brought into frame and set down, never blinking on.
   • Longer, visible travel (~30% of paper width) on a firm ease-out.
   • Opacity fades 0->1 over the first 35% of the move (no pop).
   • Gentle terminal settle; rotation eases in parallel.
   • Contact shadow tightens as the piece meets the surface.
   Text is timed so the final word lands together with the last prop.
   z:10=back … 0=front; invite z=6 so bowl/leaves/flowers/ribbon rest on top.
======================================================================== */
(function () {
  const DATA = {"closed": {"cx": -0.52, "cy": -0.42, "sw": 0.9, "ar": 0.7592, "rot": -4, "depth": "back", "uri": "assets/Envelope.png", "z": 10, "dx": -1.0, "dy": -0.15, "dist": 1.05, "spring": "soft"}, "knottinghill": {"cx": -0.7, "cy": 0.01, "sw": 0.64, "ar": 1.25806, "rot": -6, "depth": "back", "uri": "assets/Knottinghillwatercolor.png", "z": 9, "dx": -1.0, "dy": 0.12, "dist": 0.95, "spring": "mid"}, "map": {"cx": 0.7, "cy": -0.045, "sw": 0.63, "ar": 1.32993, "rot": 8, "depth": "back", "uri": "assets/Map.png", "z": 8, "dx": 1.0, "dy": -0.1, "dist": 1.0, "spring": "mid"}, "terrace": {"cx": 0.7, "cy": 0.38, "sw": 0.64, "ar": 1.33712, "rot": 6, "depth": "back", "uri": "assets/Knotting hill terrace watercolor.png", "z": 7, "dx": 1.0, "dy": 0.18, "dist": 1.0, "spring": "soft"}, "leaves": {"cx": 0.62, "cy": -0.395, "sw": 0.56, "ar": 1.29857, "rot": -14, "depth": "front", "uri": "assets/Leaves.png", "z": 1, "dx": 0.25, "dy": -1.0, "dist": 0.9, "spring": "light"}, "leftflower": {"cx": -0.72, "cy": 0.185, "sw": 0.3, "ar": 0.98933, "rot": -8, "depth": "front", "uri": "assets/leftflower.png", "z": 2, "dx": -1.0, "dy": 0.22, "dist": 0.85, "spring": "light"}, "bowl": {"cx": -0.64, "cy": 0.42, "sw": 0.52, "ar": 1.00308, "rot": 10, "depth": "front", "uri": "assets/Stamps bowl.png", "z": 4, "dx": -0.55, "dy": 1.0, "dist": 0.95, "spring": "mid"}, "ribbon": {"cx": -0.15, "cy": 0.575, "sw": 0.7, "ar": 1.06742, "rot": -18, "depth": "front", "uri": "assets/Ribbon.png", "z": 5, "dx": 0.1, "dy": 1.0, "dist": 0.9, "spring": "soft"}, "rightflower": {"cx": 0.5, "cy": 0.52, "sw": 0.35, "ar": 0.99476, "rot": 12, "depth": "front", "uri": "assets/Rightflower.png", "z": 0, "dx": 1.0, "dy": 0.35, "dist": 0.85, "spring": "light"}};
  const cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const ss = v => { const x = cl(v); return x * x * (3 - 2 * x); };

  // Placement ease: decisive travel, soft settle, faint single kiss of overshoot.
  function placeEase(p) {
    if (p <= 0) return 0; if (p >= 1) return 1;
    const e = 1 - Math.pow(1 - p, 4.2);
    const settle = Math.sin(p * Math.PI) * 0.02 * (1 - p);
    return e + settle;
  }

  const back  = document.getElementById('scene-back');
  const front = document.getElementById('scene-front');
  const menu  = document.getElementById('paper-menu');
  if (!back || !front || !menu) return;

  // Back-to-front, overlapping. Last prop (rightflower) lands at t2 = 0.82.
  const ORDER = [
    ['closed',       0.00, 0.31],
    ['knottinghill', 0.05, 0.38],
    ['map',          0.11, 0.45],
    ['leaves',       0.17, 0.51],
    ['terrace',      0.23, 0.57],
    ['leftflower',   0.30, 0.64],
    ['bowl',         0.37, 0.71],
    ['ribbon',       0.45, 0.79],
    ['rightflower',  0.52, 0.86]
  ];

  // Text synced so the LAST word finishes right as the last prop lands (~0.82).
  // names 0.34->0.50, rule 0.50->0.56, items start 0.56.
  // last item ends: 0.56 + 8*0.028 + 0.07 = 0.854  ≈ last prop 0.82 (essentially together)
  const NAMES_WIN = [0.34, 0.50];
  const RULE_WIN  = [0.50, 0.56];
  const ITEM_T0   = 0.57;
  const ITEM_STEP = 0.0311;   // re-tuned after removing "Welcome" (8 items) to keep sync with last prop
  const ITEM_DUR  = 0.072;

  const props = [];
  ORDER.forEach(([name, t0, t1]) => {
    const d = DATA[name];
    if (!d) return;
    const outer = document.createElement('div');
    outer.className = 'prop';
    outer.dataset.prop = name;
    outer.style.visibility = 'hidden';
    outer.style.zIndex = String(100 - d.z);
    const inner = document.createElement('div');
    inner.className = 'prop-inner';
    const img = document.createElement('img');
    img.src = d.uri; img.alt=''; img.draggable=false;
    inner.appendChild(img); outer.appendChild(inner);
    (d.depth === 'front' ? front : back).appendChild(outer);

    const lift = ({closed:1.5, knottinghill:1.0, map:1.0, terrace:1.0,
                   leaves:1.1, leftflower:1.6, bowl:2.0,
                   ribbon:1.0, rightflower:1.6})[name] || 1.1;
    props.push({ outer, inner, name, t0, t1,
                 dx:d.dx, dy:d.dy, cx:d.cx, cy:d.cy, sw:d.sw, ar:d.ar, rot:d.rot, lift });
  });

  function chars(el){ const t=el.textContent; el.textContent='';
    const o=[]; for(const c of t){const s=document.createElement('span');
    s.className='ch'; s.textContent=(c===' ')?'\u00A0':c; el.appendChild(s); o.push(s);} el._chars=o; return o; }
  const nameLines = Array.from(menu.querySelectorAll('.pm-line')).map(el=>({el,ch:chars(el)}));
  const rule = menu.querySelector('.pm-rule');
  const items = Array.from(menu.querySelectorAll('.pm-item')).map(el=>({el,ch:chars(el)}));
  const fleurs = Array.from(menu.querySelectorAll('.pm-fleur'));

  function write(u,p){ const cs=u.ch,n=cs.length,soft=.28;
    for(let i=0;i<n;i++){const s=(i/n)*(1-soft);const e=ss((p-s)/soft);const c=cs[i];
      c.style.opacity=e.toFixed(3);
      if(e>.985){c.style.filter='';c.style.transform='';}
      else{c.style.filter='blur('+((1-e)*0.9).toFixed(2)+'px)';c.style.transform='translateY('+((1-e)*1.8).toFixed(2)+'px)';}}}

  const PX0=0.0283, PX1=0.9672; let last='';

  function layoutScene(){
    const paperEl=document.querySelector('.inv-blank'); if(!paperEl) return;
    const r=paperEl.getBoundingClientRect(); if(!r.width||!r.height) return;
    const st=document.getElementById('stage'); const sr=st?st.getBoundingClientRect():{left:0,top:0};
    const px=(r.left-sr.left)+r.width*PX0, pw=r.width*(PX1-PX0), py=(r.top-sr.top), ph=r.height;
    const cx=px+pw/2, cy=py+ph/2;
    const key=[px,py,pw,ph].map(v=>Math.round(v)).join(','); if(key===last) return; last=key;
    props.forEach(p=>{ const w=p.sw*pw,h=w*p.ar;
      p.outer.style.width=w+'px'; p.outer.style.height=h+'px';
      p.outer.style.left=(cx+p.cx*pw-w/2)+'px'; p.outer.style.top=(cy+p.cy*ph-h/2)+'px'; p.pw=pw; });
    menu.style.left=px+'px'; menu.style.top=py+'px'; menu.style.width=pw+'px'; menu.style.height=ph+'px';
    menu.style.fontSize=(pw*0.036)+'px';
  }

  function applyScene(t2){
    layoutScene();
    if (window.__centerForAct2) window.__centerForAct2(t2);

    props.forEach(p=>{
      const raw = cl((t2 - p.t0) / (p.t1 - p.t0));
      if (raw <= 0){ p.outer.style.visibility='hidden'; return; }
      p.outer.style.visibility='visible';

      const e = placeEase(raw);
      const away = 1 - e;
      // LONGER visible travel — the piece is carried in from clearly off its spot
      const D = (p.pw || 400) * 0.30;
      const tx = p.dx * away * D;
      const ty = p.dy * away * D;
      // OVERLAPPING ACTION: rotation trails position by a beat and settles a hair
      // later — parts moving at their own rhythm is what reads as natural.
      const rotRaw = cl((raw - 0.10) / 0.90);
      const rotE   = placeEase(rotRaw);
      const rotAway = 1 - rotE;
      const rotNow = p.rot + rotAway * (p.dx >= 0 ? 6 : -6);

      // FADE UP over first 35% of the move so it emerges rather than blinking on
      const op = ss(cl(raw / 0.35));
      p.outer.style.opacity = op.toFixed(3);

      p.inner.style.transform =
        'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0) rotate(' + rotNow.toFixed(2) + 'deg)';

      // contact shadow: softer/larger while carried, tight as it sets down
      const k = (p.pw || 400) / 400;
      const hover = away;
      const bl = (3.0 + hover * 11) * k * p.lift;
      const sdy = (1.8 + hover * 7) * k * p.lift;
      const sdx = (2.2 + hover * 6) * k * p.lift;
      const al = (0.16 + 0.05 * e) * p.lift;
      p.inner.style.filter =
        'drop-shadow(' + sdx.toFixed(1) + 'px ' + sdy.toFixed(1) + 'px ' + bl.toFixed(1) +
        'px rgba(46,40,31,' + Math.min(0.34, al).toFixed(3) + '))';
    });

    const np = ss((t2 - NAMES_WIN[0]) / (NAMES_WIN[1] - NAMES_WIN[0]));
    nameLines.forEach((u,i)=>write(u, cl(np*1.2 - i*0.08)));
    const rp = ss((t2 - RULE_WIN[0]) / (RULE_WIN[1] - RULE_WIN[0]));
    if (rule) rule.style.transform = 'scaleX(' + rp.toFixed(4) + ')';
    items.forEach((u,i)=>{ const s=ITEM_T0+i*ITEM_STEP; const p=ss((t2-s)/ITEM_DUR);
      write(u,p); u.el.classList.toggle('live', p>0.9);
      if(i>0 && fleurs[i-1]) fleurs[i-1].style.opacity=ss((t2-s+0.015)/0.05).toFixed(3); });
  }

  function resetScene(){
    props.forEach(p=>{ p.outer.style.visibility='hidden'; p.outer.style.opacity='0'; p.inner.style.transform=''; p.inner.style.filter=''; });
    nameLines.concat(items).forEach(u=>u.ch.forEach(c=>{c.style.opacity='0';c.style.filter='';c.style.transform='';}));
    items.forEach(u=>u.el.classList.remove('live'));
    fleurs.forEach(f=>f.style.opacity='0');
    if(rule) rule.style.transform='scaleX(0)';
    last='';
  }

  menu.addEventListener('click', e=>{ const a=e.target.closest('.pm-item'); if(!a) return;
    e.preventDefault(); const section=a.dataset.section; a.classList.add('pm-hit');
    setTimeout(()=>a.classList.remove('pm-hit'),460);
    try{history.replaceState(null,'','#'+section);}catch(_){location.hash=section;}
    if(typeof window.onInvitationNav==='function') window.onInvitationNav(section);
    window.dispatchEvent(new CustomEvent('invitation:navigate',{detail:{section}})); });

  let rz; window.addEventListener('resize', ()=>{clearTimeout(rz); rz=setTimeout(()=>{last='';layoutScene();},120);});

  window.applyScene=applyScene; window.layoutScene=layoutScene; window.resetScene=resetScene;
  resetScene();
})();
</script>
